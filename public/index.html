<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify to YouTube</title>
<meta name="description" content="Paste a Spotify track, playlist or album link and get the songs on YouTube.">
<link rel="stylesheet" href="/tailwind.css">
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased">
<main class="mx-auto max-w-3xl px-4 py-10 sm:py-14">

  <h1 class="text-2xl font-semibold tracking-tight">Spotify to YouTube</h1>
  <p class="mt-1 text-sm text-neutral-400">Paste a Spotify track, playlist or album link. Get the songs on YouTube.</p>

  <form id="form" class="mt-6 flex flex-wrap gap-2">
    <input id="input" type="text" autocomplete="off" autofocus
      placeholder="https://open.spotify.com/track/..."
      class="min-w-0 flex-1 basis-64 rounded-xl border border-neutral-800 bg-neutral-900 px-4 py-3 text-neutral-100 placeholder:text-neutral-500 focus:border-green-500 focus:ring-2 focus:ring-green-500/40 focus:outline-none">
    <button id="go" type="submit"
      class="rounded-xl bg-green-500 px-5 py-3 font-semibold text-green-950 transition hover:bg-green-400 disabled:cursor-default disabled:opacity-50">
      Find
    </button>
  </form>

  <p id="status" hidden class="mt-5 text-sm text-neutral-400"></p>
  <div id="out" class="mt-6"></div>

  <footer class="mt-12 border-t border-neutral-900 pt-5 text-xs text-neutral-500">
    Playlists and albums resolve up to 100 tracks, the limit of Spotify's public embed.
    <a href="https://github.com/0-don/sp2yt" class="text-neutral-400 underline decoration-neutral-700 hover:text-green-400">Source on GitHub</a>
  </footer>
</main>

<script>
const form = document.getElementById("form");
const input = document.getElementById("input");
const go = document.getElementById("go");
const statusLine = document.getElementById("status");
const out = document.getElementById("out");

const BATCH = 12;
const WATCH_CAP = 50;
const LINK_RE = /(open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|playlist|album)\/[A-Za-z0-9]{22})|^spotify:(track|playlist|album):[A-Za-z0-9]{22}$/;

function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function clock(ms) {
  if (!ms) return "";
  const total = Math.round(ms / 1000);
  return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}

function kindOf(value) {
  const match = value.match(/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?|spotify:)(track|playlist|album)/);
  return match ? match[1] : "track";
}

function setStatus(text, tone) {
  statusLine.hidden = !text;
  statusLine.textContent = text || "";
  statusLine.className = tone === "error"
    ? "mt-5 text-sm text-red-400"
    : "mt-5 text-sm text-neutral-400";
}

function pill(href, label) {
  return `<a href="${esc(href)}" target="_blank" rel="noreferrer"
    class="inline-block rounded-full border border-neutral-800 px-4 py-2 text-xs text-neutral-200 transition hover:border-green-500 hover:text-green-400">${esc(label)}</a>`;
}

function renderTrack(data) {
  const sp = data.spotify;
  const best = data.best;
  const alts = data.alternates.map((a) => `
    <li class="text-sm">
      <a href="${esc(a.url)}" target="_blank" rel="noreferrer" class="text-green-400 hover:underline">${esc(a.title)}</a>
      <span class="text-neutral-500">${esc(a.artists.join(", "))} ${clock(a.durationMs)} &middot; ${Math.round(a.score * 100)}%</span>
    </li>`).join("");

  out.innerHTML = `
    <section class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5">
      <div class="flex items-center gap-4">
        ${sp.artwork ? `<img src="${esc(sp.artwork)}" alt="" class="size-16 shrink-0 rounded-lg">` : ""}
        <div class="min-w-0">
          <div class="truncate font-semibold">${esc(sp.title)}</div>
          <div class="truncate text-sm text-neutral-400">${esc(sp.artists.join(", "))} &middot; ${clock(sp.durationMs)}</div>
        </div>
      </div>

      <div class="mt-5 border-t border-neutral-800 pt-5">
        <div class="relative aspect-video w-full overflow-hidden rounded-xl bg-black">
          <iframe class="absolute inset-0 size-full border-0" src="https://www.youtube.com/embed/${esc(best.videoId)}"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"
            allowfullscreen title="${esc(best.title)}"></iframe>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-2">
          ${pill(best.url, "YouTube")}
          ${pill(best.musicUrl, "YouTube Music")}
          <button type="button" data-copy="${esc(best.url)}"
            class="rounded-full border border-neutral-800 px-4 py-2 text-xs text-neutral-200 transition hover:border-green-500 hover:text-green-400">Copy link</button>
          <span class="ml-auto text-xs text-neutral-500">${Math.round(best.score * 100)}% match ${clock(best.durationMs)}</span>
        </div>
      </div>

      ${alts ? `
        <details class="mt-4">
          <summary class="cursor-pointer text-sm text-neutral-400 hover:text-neutral-200">Other matches (${data.alternates.length})</summary>
          <ol class="mt-3 list-decimal space-y-2 pl-5">${alts}</ol>
        </details>` : ""}
    </section>`;
}

function collectionShell(collection) {
  const count = collection.tracks.length;
  return `
    <section class="rounded-2xl border border-neutral-800 bg-neutral-900 p-5">
      <div class="flex items-center gap-4">
        ${collection.artwork ? `<img src="${esc(collection.artwork)}" alt="" class="size-16 shrink-0 rounded-lg">` : ""}
        <div class="min-w-0 flex-1">
          <div class="truncate font-semibold">${esc(collection.name)}</div>
          <div class="truncate text-sm text-neutral-400">
            ${esc(collection.kind)} &middot; ${count} track${count === 1 ? "" : "s"}${collection.truncated ? ", clipped at Spotify's 100 limit" : ""}
          </div>
        </div>
      </div>

      <div class="mt-4 h-1.5 w-full overflow-hidden rounded-full bg-neutral-800">
        <div id="bar" class="h-full w-0 rounded-full bg-green-500 transition-all duration-300"></div>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <span id="queues" class="flex flex-wrap gap-2"></span>
        <button type="button" id="copyAll"
          class="rounded-full border border-neutral-800 px-4 py-2 text-xs text-neutral-200 opacity-40 transition" disabled>Copy all links</button>
        <span id="tally" class="ml-auto text-xs text-neutral-500">resolving 0/${count}</span>
      </div>
      <p id="queueNote" hidden class="mt-2 text-xs text-neutral-500">
        YouTube queue links hold 50 videos each. Opening one creates a playlist you can save from the YouTube or YouTube Music player.
      </p>

      <ol id="rows" class="mt-5 divide-y divide-neutral-800 border-t border-neutral-800"></ol>
    </section>`;
}

function rowMarkup(track, position) {
  return `
    <li id="row-${position}" class="flex items-center gap-3 py-2.5">
      <span class="w-7 shrink-0 pr-1 text-right text-xs tabular-nums text-neutral-500">${position + 1}</span>
      <div class="min-w-0 flex-1">
        <div class="truncate text-sm">${esc(track.title)}</div>
        <div class="truncate text-xs text-neutral-500">${esc(track.artists.join(", "))} &middot; ${clock(track.durationMs)}</div>
      </div>
      <span class="result shrink-0 text-xs text-neutral-600">waiting</span>
    </li>`;
}

async function runTrack(value) {
  const res = await fetch("/api/resolve?url=" + encodeURIComponent(value));
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  setStatus("");
  renderTrack(data);
}

async function runCollection(value) {
  const res = await fetch("/api/collection?url=" + encodeURIComponent(value));
  const collection = await res.json();
  if (!res.ok) throw new Error(collection.error || "Request failed");
  if (!collection.tracks.length) throw new Error("That collection has no playable tracks");

  setStatus("");
  out.innerHTML = collectionShell(collection);
  const rows = document.getElementById("rows");
  const bar = document.getElementById("bar");
  const tally = document.getElementById("tally");
  const queues = document.getElementById("queues");
  const queueNote = document.getElementById("queueNote");
  const copyAll = document.getElementById("copyAll");
  rows.innerHTML = collection.tracks.map(rowMarkup).join("");

  const found = [];
  let done = 0;
  let failed = 0;

  for (let start = 0; start < collection.tracks.length; start += BATCH) {
    const slice = collection.tracks.slice(start, start + BATCH);
    let matches;
    try {
      const batchRes = await fetch("/api/match", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tracks: slice }),
      });
      const payload = await batchRes.json();
      if (!batchRes.ok) throw new Error(payload.error || "Batch failed");
      matches = payload.matches;
    } catch (err) {
      matches = slice.map((track, index) => ({ index, best: null, error: err.message }));
    }

    for (const match of matches) {
      const position = start + match.index;
      const cell = document.querySelector("#row-" + position + " .result");
      done += 1;
      if (match.best) {
        found.push(match.best);
        cell.outerHTML = `
          <a href="${esc(match.best.url)}" target="_blank" rel="noreferrer"
            class="result shrink-0 text-xs text-green-400 hover:underline">YouTube ${Math.round(match.best.score * 100)}%</a>`;
      } else {
        failed += 1;
        cell.className = "result shrink-0 text-xs text-red-400";
        cell.textContent = "no match";
      }
    }

    bar.style.width = Math.round((done / collection.tracks.length) * 100) + "%";
    tally.textContent = `resolved ${done - failed}/${collection.tracks.length}` + (failed ? `, ${failed} failed` : "");

    if (found.length) {
      const chunks = [];
      for (let at = 0; at < found.length; at += WATCH_CAP) chunks.push(found.slice(at, at + WATCH_CAP));
      queues.innerHTML = chunks.map((chunk, position) => {
        const ids = chunk.map((m) => m.videoId).join(",");
        const from = position * WATCH_CAP + 1;
        const label = chunks.length === 1 ? "Open all in YouTube" : `Open ${from} to ${from + chunk.length - 1}`;
        return `<a href="https://www.youtube.com/watch_videos?video_ids=${ids}" target="_blank" rel="noreferrer"
          class="rounded-full bg-green-500 px-4 py-2 text-xs font-semibold text-green-950 transition hover:bg-green-400">${label}</a>`;
      }).join("");
      queueNote.hidden = false;
      copyAll.disabled = false;
      copyAll.className = "rounded-full border border-neutral-800 px-4 py-2 text-xs text-neutral-200 transition hover:border-green-500 hover:text-green-400";
      copyAll.dataset.copy = found.map((m) => m.url).join("\n");
    }
  }
}

async function run(value) {
  setStatus("Searching...");
  out.innerHTML = "";
  go.disabled = true;
  try {
    if (kindOf(value) === "track") await runTrack(value);
    else await runCollection(value);
  } catch (err) {
    setStatus(err.message, "error");
  } finally {
    go.disabled = false;
  }
}

document.addEventListener("click", async (event) => {
  const trigger = event.target.closest("[data-copy]");
  if (!trigger) return;
  event.preventDefault();
  await navigator.clipboard.writeText(trigger.dataset.copy);
  const original = trigger.textContent;
  trigger.textContent = "Copied";
  setTimeout(() => { trigger.textContent = original; }, 1200);
});

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const value = input.value.trim();
  if (value) run(value);
});

input.addEventListener("paste", () => {
  setTimeout(() => {
    const value = input.value.trim();
    if (LINK_RE.test(value)) run(value);
  }, 0);
});

const seed = new URLSearchParams(location.search).get("url");
if (seed) { input.value = seed; run(seed); }
</script>
</body>
</html>
